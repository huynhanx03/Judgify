static_resources:
  listeners:
    - name: local_http
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: local_http
                generate_request_id: true
                preserve_external_request_id: false
                normalize_path: true
                merge_slashes: true
                route_config:
                  name: local_routes
                  virtual_hosts:
                    - name: judgify_local
                      domains: ["*"]
                      request_headers_to_add:
                        - header:
                            key: x-correlation-id
                            value: "%REQ(X-REQUEST-ID)%"
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                        - header:
                            key: x-forwarded-proto
                            value: http
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                      response_headers_to_add:
                        - header:
                            key: x-request-id
                            value: "%REQ(X-REQUEST-ID)%"
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                        - header:
                            key: x-correlation-id
                            value: "%REQ(X-REQUEST-ID)%"
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                      routes:
                        - match:
                            path: /api
                          redirect:
                            path_redirect: /api/
                        - match:
                            prefix: /api/
                          route:
                            cluster: api
                            prefix_rewrite: /
                            timeout: 30s
                        - match:
                            path: /ws
                          route:
                            cluster: api
                            timeout: 0s
                        - match:
                            prefix: /_next/static/
                          route:
                            cluster: website
                        - match:
                            prefix: /
                          route:
                            cluster: website
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: api
      connect_timeout: 3s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: api
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: api
                      port_value: 8000
    - name: website
      connect_timeout: 3s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: website
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: website
                      port_value: 3000
