services:
  postgres:
    image: postgres:16.14-alpine3.23@sha256:42b8b8b29c8a4e933d88943e5b03001a78794905cf786e6e7634e9f2abd5a0d3
    environment:
      POSTGRES_USER: judgify_test
      POSTGRES_PASSWORD: judgify_test
      POSTGRES_DB: judgify_test
    ports:
      - "127.0.0.1:${JUDGIFY_TEST_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judgify_test -d judgify_test"]
      interval: 2s
      timeout: 3s
      retries: 30
