api:
  - changed-files:
      - any-glob-to-any-file: "api/**"

website:
  - changed-files:
      - any-glob-to-any-file: "website/**"

docs:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "*.md"

docker:
  - changed-files:
      - any-glob-to-any-file:
          - "docker/**"
          - "docker-compose.yml"

operations:
  - changed-files:
      - any-glob-to-any-file:
          - "deploy/**"
          - "ops/**"
          - "scripts/backup/**"
          - "scripts/deploy/**"
          - "scripts/restore/**"
          - "scripts/verify/**"
          - "test/chaos/**"
          - "test/load/**"
          - "test/operations/**"

ci:
  - changed-files:
      - any-glob-to-any-file: ".github/**"
