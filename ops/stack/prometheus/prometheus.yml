global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: judgify-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:9090"]
        labels:
          service: judgify-api
          environment: production
  - job_name: judgify-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9091"]
        labels:
          service: judgify-worker
          environment: production
  - job_name: judgify-envoy
    metrics_path: /stats/prometheus
    static_configs:
      - targets: ["ingress:9901"]
        labels:
          service: judgify-envoy
          environment: production
  - job_name: judgify-website
    metrics_path: /internal/metrics
    static_configs:
      - targets: ["website:3000"]
        labels:
          service: judgify-website
          environment: production
  - job_name: judgify-alloy
    metrics_path: /metrics
    static_configs:
      - targets: ["alloy:12345"]
        labels:
          service: judgify-alloy
          environment: production
